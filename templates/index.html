<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md mx-4">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-3">QR Code Generator</h1>
        <input type="url" id="urlInput" placeholder="Enter URL here" class="w-full border border-gray-300 rounded-lg p-3 mb-4 bg-blue-100 hover:bg-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        <button id="generateBtn" class="w-full bg-blue-600 text-white font-semibold p-3 rounded-lg hover:bg-blue-900">
           Generate QR Code
        </button>
        <p id="errorMessage" class="text-red-500 text-center mt-3"></p>
        <div id="qrContainer" class="mt-6 flex flex-col items-center">
    </div>
</div>

<script src="/static/js/script.js"></script>

</body>

</html>
